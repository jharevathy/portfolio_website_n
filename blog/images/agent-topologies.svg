<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Hanken Grotesk, Helvetica Neue, Arial, sans-serif">
  <rect width="960" height="360" rx="22" fill="#07080d"/>
  <g fill="none" stroke="rgba(255,255,255,.14)"><rect x="20" y="20" width="293" height="320" rx="16"/><rect x="333" y="20" width="294" height="320" rx="16"/><rect x="647" y="20" width="293" height="320" rx="16"/></g>
  <!-- supervisor -->
  <g transform="translate(66 50)">
    <g stroke="rgba(255,255,255,.38)" stroke-width="1.4" fill="none"><path d="M100 46 30 138M100 46v92M100 46l70 92"/></g>
    <circle cx="100" cy="32" r="16" fill="rgba(243,198,140,.22)" stroke="#f3c68c" stroke-width="1.5"/>
    <g fill="#0b0d13" stroke="rgba(255,255,255,.7)" stroke-width="1.4"><circle cx="30" cy="148" r="12"/><circle cx="100" cy="148" r="12"/><circle cx="170" cy="148" r="12"/></g>
  </g>
  <!-- router + dag -->
  <g transform="translate(355 50)">
    <g stroke="rgba(255,255,255,.38)" stroke-width="1.4" fill="none"><path d="M26 92h50M120 92h30M194 92h32"/></g>
    <g fill="#0b0d13" stroke="rgba(255,255,255,.7)" stroke-width="1.4"><circle cx="14" cy="92" r="12"/><circle cx="238" cy="92" r="12"/></g>
    <rect x="76" y="74" width="44" height="36" rx="8" fill="rgba(243,198,140,.22)" stroke="#f3c68c" stroke-width="1.5"/>
    <rect x="150" y="74" width="44" height="36" rx="8" fill="#0b0d13" stroke="rgba(255,255,255,.7)" stroke-width="1.4"/>
  </g>
  <!-- swarm -->
  <g transform="translate(694 50)">
    <g stroke="rgba(255,255,255,.38)" stroke-width="1.4" fill="none" stroke-dasharray="4 6"><path d="M30 50 100 140 170 50M30 50h140"/></g>
    <g fill="#0b0d13" stroke="rgba(255,255,255,.7)" stroke-width="1.4"><circle cx="30" cy="50" r="12"/><circle cx="170" cy="50" r="12"/></g>
    <circle cx="100" cy="146" r="12" fill="rgba(243,198,140,.22)" stroke="#f3c68c" stroke-width="1.5"/>
  </g>
  <g font-size="19" font-weight="600" fill="#eef0f3"><text x="44" y="262">Supervisor</text><text x="357" y="262">Router + DAG</text><text x="671" y="262">Swarm hand-off</text></g>
  <g font-size="15" fill="#a9afba">
    <text x="44" y="290">One LLM delegates, checks and</text><text x="44" y="312">decides. Most control, slowest.</text>
    <text x="357" y="290">Classify once, then run a fixed</text><text x="357" y="312">graph. Predictable and cheap.</text>
    <text x="671" y="290">Agents pass control directly.</text><text x="671" y="312">Flexible, hardest to debug.</text>
  </g>
</svg>
