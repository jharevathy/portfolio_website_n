<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blog · Nikhil Salunke</title>
<meta name="description" content="A blog by Nikhil Salunke, GenAI Architect.">
<meta name="theme-color" content="#05060a">
<meta property="og:title" content="Blog · Nikhil Salunke">
<meta property="og:type" content="article">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2305060a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23f3c68c' stroke-width='1.5' stroke-dasharray='1.4 2.6'/%3E%3Ccircle cx='16' cy='16' r='3.2' fill='%23f3c68c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="blog.css">
</head>
<body>
<canvas id="stage" aria-hidden="true"></canvas>
<div class="cursor" id="cursor" aria-hidden="true"></div>
<div class="progress" aria-hidden="true"><i id="bar"></i></div>

<header class="topbar">
  <div class="wrap">
    <a class="mark" href="../">
      <svg viewBox="0 0 30 30" aria-hidden="true"><g class="orbit"><circle cx="15" cy="15" r="11" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="1.4 3"/></g><circle cx="15" cy="15" r="3.4" fill="currentColor"/></svg>
      Nikhil Salunke
    </a>
    <div class="topbar__right">
      <a class="btn btn--ghost" href="./">Library</a>
      <a class="btn btn--solid" href="../#s-contact">Let’s talk</a>
    </div>
  </div>
</header>

<main class="post wrap" id="post"></main>

<footer class="site-foot">
  <div class="wrap mono"><span>© 2026 Nikhil Salunke</span><a href="./">All blogs</a></div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="vendor/marked.min.js"></script>
<script src="loader.js"></script>
<script src="blog.js"></script>
<script>
(function () {
  var B = window.Blog, $ = B.$, $$ = B.$$, esc = B.esc, reduce = B.reduce, POSTS = [];
  B.chrome();
  B.swarm({ form: 0, dim: .42 });

  /* ---------- turning a blog's text into the page ---------- */
  var LANG = { js: 'JavaScript', javascript: 'JavaScript', ts: 'TypeScript', typescript: 'TypeScript', py: 'Python', python: 'Python', bash: 'Shell', sh: 'Shell', shell: 'Shell', json: 'JSON', yaml: 'YAML', yml: 'YAML', sql: 'SQL', html: 'HTML', css: 'CSS', java: 'Java', go: 'Go', rust: 'Rust', c: 'C', cpp: 'C++', text: 'Text' };
  function highlight(code) {
    var re = /(#.*$|\/\/.*$)|("[^"\n]*"|'[^'\n]*')|\b(from|import|export|class|def|return|const|await|async|for|in|if|elif|else|function|new|let|var|while|try|except|catch|with|as|lambda|yield|None|True|False|null|true|false)\b/gm, out = '', last = 0, m;
    while ((m = re.exec(code))) {
      out += esc(code.slice(last, m.index)) + '<span class="' + (m[1] ? 'tk-c' : m[2] ? 'tk-s' : 'tk-k') + '">' + esc(m[0]) + '</span>';
      last = re.lastIndex;
    }
    return out + esc(code.slice(last));
  }
  var CALLOUT = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2.5 20h19z"/><path d="M12 10v4M12 17.2v.1"/></svg>';
  var inline = function (t) { return marked.parseInline(t || ''); };
  var plain = function (t) { var d = document.createElement('div'); d.innerHTML = inline(t); return d.textContent; };
  function block(t, state) {
    switch (t.type) {
      case 'heading': return '<h3>' + inline(t.text) + '</h3>';
      case 'paragraph':
        if (t.tokens && t.tokens.length === 1 && t.tokens[0].type === 'image') {
          var im = t.tokens[0];
          return '<figure class="figure"><img src="' + esc(im.href) + '" alt="' + esc(im.text) + '" loading="lazy">' + (im.text ? '<figcaption class="mono">' + esc(im.text) + '</figcaption>' : '') + '</figure>';
        }
        var c = /^(note|tip|rule|warning|important)\s*:\s*/i.exec(t.text);
        if (c) return '<div class="callout">' + CALLOUT + '<p><b>' + c[1].charAt(0).toUpperCase() + c[1].slice(1).toLowerCase() + '.</b> ' + inline(t.text.slice(c[0].length)) + '</p></div>';
        var lead = !state.lead; state.lead = true;
        return '<p' + (lead ? ' class="lead"' : '') + '>' + inline(t.text) + '</p>';
      case 'blockquote':
        return '<blockquote class="pull"><p>' + inline(t.text.replace(/\n+/g, ' ')).replace(/<em>/g, '<span class="gold">').replace(/<\/em>/g, '</span>') + '</p></blockquote>';
      case 'list':
        var tag = t.ordered ? 'ol' : 'ul';
        return '<' + tag + '>' + t.items.map(function (it) { return '<li>' + inline(it.text) + '</li>'; }).join('') + '</' + tag + '>';
      case 'code':
        var info = (t.lang || '').trim().split(/\s+/), lang = (info[0] || '').toLowerCase(), file = info.slice(1).join(' ');
        var label = [file, LANG[lang] || (lang ? lang.toUpperCase() : '')].filter(Boolean).join(' · ') || 'Code';
        return '<div class="codeblock"><div class="codeblock__bar"><span class="mono">' + esc(label) + '</span><button type="button" data-copycode>Copy</button></div><pre>' + highlight(t.text) + '</pre></div>';
      case 'table': return '<div class="table">' + marked.parser([t]) + '</div>';
      case 'html': return t.text;
      case 'hr': return '<hr>';
      case 'space': return '';
      default: return t.text ? '<p>' + inline(t.text) + '</p>' : '';
    }
  }
  // "## Heading" starts a section in the contents panel; anything before the first one is the introduction
  function sections(md) {
    var out = [], cur = { h: '', html: '' }, state = {};
    marked.lexer(md).forEach(function (t) {
      if (t.type === 'heading' && t.depth <= 2) { if (cur.h || cur.html) out.push(cur); cur = { h: t.text, html: '' }; return; }
      cur.html += block(t, state);
    });
    if (cur.h || cur.html) out.push(cur);
    return out;
  }

  function neighbour(x, dir) {
    var nx = dir === 'nx';
    if (!x) return '<a class="glass' + (nx ? ' nx' : '') + '" href="./"><span class="mono">' + (nx ? 'You’ve reached the end' : 'This is the newest blog') + '</span><strong>Back to the library</strong></a>';
    return '<a class="glass' + (nx ? ' nx' : '') + '" href="' + window.BLOG.href(x.slug) + '" data-slug="' + esc(x.slug) + '"><span class="mono">' + (nx ? 'Next blog →' : '← Previous blog') + '</span><strong>' + esc(x.title) + '</strong><span class="keys">' + (nx ? 'or press →' : 'or press ←') + '</span></a>';
  }

  var cur = null;
  function render(p, failed) {
    cur = p;
    var root = $('#post');
    if (!p) {
      document.title = (failed ? 'Couldn’t load the blog' : 'Blog not found') + ' · Nikhil Salunke';
      root.innerHTML = '<div class="missing glass enter"><p class="mono">' + (failed ? 'Connection' : '404 · Blog') + '</p><h1 class="display" style="font-size:clamp(40px,6vw,80px)">' + (failed ? 'Couldn’t load this blog' : 'This blog has moved') + '</h1><p class="lede">' + (failed ? 'Check your connection and refresh the page.' : 'The link may be out of date. Every blog is in the library.') + '</p><a class="btn btn--solid" href="./">Open the library <svg viewBox="0 0 16 16"><path d="M4 12 12 4M6 4h6v6"/></svg></a></div>';
      return;
    }
    document.title = p.title + ' · Nikhil Salunke';
    var md = document.querySelector('meta[name="description"]'); if (md && p.dek) md.setAttribute('content', p.dek);
    var prev = POSTS[p.i - 1], next = POSTS[p.i + 1], secs = sections(p.body), n = 0;
    var body = secs.map(function (s) {
      if (!s.h) return s.html;
      var si = n++;
      return '<h2 id="sec-' + si + '"><span class="n">' + String(si + 1).padStart(2, '0') + '</span>' + inline(s.h) + '</h2>' + s.html;
    }).join('');
    var toc = secs.filter(function (s) { return s.h; });
    root.innerHTML =
      '<header class="art-hero enter">' +
        '<nav class="crumbs mono" aria-label="Breadcrumb"><a href="../">Home</a><span>/</span><a href="./">Library</a><span>/</span><span class="topic">' + esc(p.topic) + '</span></nav>' +
        '<h1 class="display art-title">' + esc(p.title) + '</h1>' +
        (p.dek ? '<p class="art-dek">' + esc(p.dek) + '</p>' : '') +
        (p.tags.length ? '<div class="chips">' + p.tags.map(function (t) { return '<span class="chip">' + esc(t) + '</span>'; }).join('') + '</div>' : '') +
        '<div class="byline"><span class="avatar" aria-hidden="true">NS</span><div><strong>Nikhil Salunke</strong><span class="mono">GenAI Architect</span></div><div class="meta">' + (p.date ? '<span>' + esc(p.date) + '</span>' : '') + '<span>' + p.min + ' min read</span></div></div>' +
      '</header>' +
      '<div class="reader enter' + (toc.length ? '' : ' no-toc') + '" style="animation-delay:.12s">' +
        '<details class="toc" id="toc" open><summary class="mono">Contents · <span class="left" id="left">' + p.min + ' min left</span></summary><ol>' +
          toc.map(function (s, si) { return '<li><a href="#sec-' + si + '" data-sec="' + si + '">' + esc(plain(s.h)) + '</a></li>'; }).join('') +
        '</ol><div class="share"><button class="chip" type="button" id="copylink">Copy link</button><a class="chip" id="li-share" target="_blank" rel="noopener">Share on LinkedIn</a></div></details>' +
        '<article class="paper glass"><div class="prose">' +
          (p.take.length ? '<div class="takeaways"><p class="mono">Key takeaways</p><ol>' + p.take.map(function (t) { return '<li>' + inline(t) + '</li>'; }).join('') + '</ol></div>' : '') +
          body + '</div></article>' +
      '</div>' +
      '<div class="endcap">' +
        '<div class="author glass"><span class="avatar" aria-hidden="true">NS</span><div><strong>Written by Nikhil Salunke</strong><p>GenAI Architect at Vodafone Idea, building production AI on open-source stacks.</p></div><div class="author__cta"><a class="btn btn--ghost" href="../assets/resume.pdf" download="Nikhil-Salunke-Resume.pdf" data-resume>Download résumé</a><a class="btn btn--solid" href="../#s-contact">Work with me</a></div></div>' +
        '<nav class="nextprev" aria-label="More blogs">' + neighbour(prev, 'pv') + neighbour(next, 'nx') + '</nav>' +
        '<button class="btn btn--ghost totop" type="button" id="totop">Back to top</button>' +
      '</div>';
    $('#toc').open = innerWidth > 1100;
    $$('#toc ol a').forEach(function (a) {
      a.addEventListener('click', function (e) { e.preventDefault(); var t = document.getElementById('sec-' + a.dataset.sec); if (t) t.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth' }); });
    });
    $('#toc summary').addEventListener('click', function (e) { if (innerWidth > 1100) e.preventDefault(); });
    $$('[data-copycode]').forEach(function (b) { b.addEventListener('click', function () { B.copy(b, b.closest('.codeblock').querySelector('pre').textContent); }); });
    $('#copylink').addEventListener('click', function () { B.copy(this, location.href); });
    $('#li-share').href = 'https://www.linkedin.com/sharing/share-offsite/?url=' + encodeURIComponent(location.href);
    $('#totop').addEventListener('click', function () { scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' }); });
    B.resume(root);
    onScroll();
  }

  // Previous / Next swap the blog in place, so the swarm keeps flowing between them
  function open(slug, push) {
    var p = window.BLOG.find(POSTS, slug);
    if (!p) return false;
    if (push) history.pushState({ slug: slug }, '', window.BLOG.href(slug));
    render(p);
    scrollTo(0, 0);
    return true;
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[data-slug]');
    if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
    if (open(a.dataset.slug, true)) e.preventDefault();
  });
  addEventListener('popstate', function () { render(window.BLOG.find(POSTS, new URLSearchParams(location.search).get('p'))); });
  addEventListener('keydown', function (e) {
    var tag = (document.activeElement || {}).tagName;
    if (!cur || tag === 'INPUT' || tag === 'TEXTAREA' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowRight' && POSTS[cur.i + 1]) open(POSTS[cur.i + 1].slug, true);
    if (e.key === 'ArrowLeft' && POSTS[cur.i - 1]) open(POSTS[cur.i - 1].slug, true);
  });

  function onScroll() {
    var paper = $('.paper'); if (!paper || !cur) { $('#bar').style.transform = 'scaleX(0)'; return; }
    var r = paper.getBoundingClientRect();
    var pr = Math.min(1, Math.max(0, (innerHeight * .5 - r.top) / r.height));
    $('#bar').style.transform = 'scaleX(' + pr + ')';
    $('#left').textContent = pr >= .995 ? 'Finished' : Math.max(1, Math.ceil(cur.min * (1 - pr))) + ' min left';
    var heads = $$('.prose h2'), on = heads[0];
    heads.forEach(function (h) { if (h.getBoundingClientRect().top < innerHeight * .35) on = h; });
    $$('#toc ol a').forEach(function (a) { a.classList.toggle('on', !!on && 'sec-' + a.dataset.sec === on.id); });
  }
  addEventListener('scroll', onScroll, { passive: true });
  addEventListener('resize', onScroll);

  window.BLOG.load().then(function (posts) {
    POSTS = posts;
    var slug = new URLSearchParams(location.search).get('p');
    render(slug ? window.BLOG.find(POSTS, slug) : POSTS[0]);
  }, function () { render(null, true); });
})();
</script>
</body>
</html>
