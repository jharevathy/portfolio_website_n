<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Library · Nikhil Salunke</title>
<meta name="description" content="Blogs by Nikhil Salunke on moving from telecom into AI, and on building GenAI systems that hold up in production.">
<meta name="theme-color" content="#05060a">
<meta property="og:title" content="The Library · Nikhil Salunke">
<meta property="og:description" content="Blogs on RAG, agents, evaluation and engineering GenAI for production.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2305060a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23f3c68c' stroke-width='1.5' stroke-dasharray='1.4 2.6'/%3E%3Ccircle cx='16' cy='16' r='3.2' fill='%23f3c68c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="blog.css">
</head>
<body>
<canvas id="stage" aria-hidden="true"></canvas>
<div class="cursor" id="cursor" aria-hidden="true"></div>

<header class="topbar">
  <div class="wrap">
    <a class="mark" href="../">
      <svg viewBox="0 0 30 30" aria-hidden="true"><g class="orbit"><circle cx="15" cy="15" r="11" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="1.4 3"/></g><circle cx="15" cy="15" r="3.4" fill="currentColor"/></svg>
      Nikhil Salunke
    </a>
    <div class="topbar__right">
      <a class="btn btn--ghost" href="../">Home</a>
      <a class="btn btn--solid" href="../#s-contact">Let’s talk</a>
    </div>
  </div>
</header>

<main class="library wrap">
  <div class="lib-head">
    <div>
      <p class="mono" style="margin-bottom:14px">Blog · Nikhil Salunke</p>
      <h1 class="display lib-title">The <span class="gold">library</span></h1>
    </div>
    <div class="lib-intro glass">
      <p class="lede">Notes on moving from telecom into AI, and on building GenAI systems that hold up in production.</p>
      <div class="lib-stats">
        <div><strong class="foil" id="st-n">0</strong><span class="mono">Blogs</span></div>
        <div><strong class="foil" id="st-min">0</strong><span class="mono">Minutes of reading</span></div>
        <div><strong class="foil" id="st-top">0</strong><span class="mono">Topics</span></div>
      </div>
    </div>
  </div>
  <div class="controls glass">
    <div class="chips" id="topics" role="group" aria-label="Filter by topic"></div>
    <label class="search" for="q">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/></svg>
      <input id="q" type="search" placeholder="Search blogs" autocomplete="off" aria-describedby="count">
      <kbd aria-hidden="true">/</kbd>
      <button class="clear" type="button" id="clear" aria-label="Clear search" hidden><svg viewBox="0 0 12 12"><path d="m2 2 8 8M10 2l-8 8"/></svg></button>
    </label>
  </div>
  <div class="results"><span class="mono" id="count" aria-live="polite"></span><span class="mono">Newest first</span></div>
  <div class="grid" id="grid"></div>
</main>

<footer class="site-foot">
  <div class="wrap mono"><span>© 2026 Nikhil Salunke</span><a href="../">Back to the homepage</a></div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="posts.js"></script>
<script src="blog.js"></script>
<script>
(function () {
  var B = window.Blog, $ = B.$, $$ = B.$$, esc = B.esc, POSTS = window.BLOG.posts;
  B.chrome();
  B.swarm({ cycle: [1, 2, 3, 4] });

  var topic = null, query = '';
  var topics = POSTS.map(function (p) { return p.topic; }).filter(function (t, i, a) { return a.indexOf(t) === i; });
  $('#st-n').textContent = POSTS.length;
  $('#st-min').textContent = POSTS.reduce(function (s, p) { return s + p.min; }, 0);
  $('#st-top').textContent = topics.length;
  $('#topics').innerHTML = '<button class="chip" type="button" aria-pressed="true" data-topic="">All topics</button>' +
    topics.map(function (t) { return '<button class="chip" type="button" aria-pressed="false" data-topic="' + esc(t) + '">' + esc(t) + '</button>'; }).join('');
  function setTopic(t) {
    topic = t || null;
    $$('[data-topic]').forEach(function (x) { x.setAttribute('aria-pressed', (x.dataset.topic || null) === topic); });
  }
  $$('[data-topic]').forEach(function (b) { b.addEventListener('click', function () { setTopic(b.dataset.topic); render(); }); });

  var q = $('#q');
  q.addEventListener('input', function () { query = q.value.trim(); $('#clear').hidden = !query; render(); });
  $('#clear').addEventListener('click', function () { q.value = ''; query = ''; $('#clear').hidden = true; render(); q.focus(); });
  addEventListener('keydown', function (e) {
    var tag = (document.activeElement || {}).tagName;
    if (e.key === '/' && tag !== 'INPUT' && tag !== 'TEXTAREA' && !e.metaKey && !e.ctrlKey) { e.preventDefault(); q.focus(); }
    if (e.key === 'Escape' && document.activeElement === q) q.blur();
  });

  function hl(s) {
    if (!query) return esc(s);
    var i = s.toLowerCase().indexOf(query.toLowerCase());
    return i < 0 ? esc(s) : esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + query.length)) + '</mark>' + esc(s.slice(i + query.length));
  }
  function render() {
    var ql = query.toLowerCase();
    var list = POSTS.filter(function (p) {
      if (topic && p.topic !== topic) return false;
      return !ql || (p.title + ' ' + p.topic + ' ' + p.tags.join(' ') + ' ' + p.quote).toLowerCase().indexOf(ql) >= 0;
    });
    $('#count').textContent = list.length === POSTS.length ? 'Showing all ' + list.length + ' blogs' : 'Showing ' + list.length + ' of ' + POSTS.length + ' blogs';
    var g = $('#grid');
    if (!list.length) {
      g.innerHTML = '<div class="empty glass"><p>No blogs match “' + esc(query || topic) + '”.</p><button class="btn btn--ghost" type="button" id="reset">Clear search and topic</button></div>';
      $('#reset').addEventListener('click', function () { q.value = ''; query = ''; $('#clear').hidden = true; setTopic(null); render(); });
      return;
    }
    g.innerHTML = list.map(function (p) {
      return '<a class="card glass" href="' + window.BLOG.href(p.slug) + '"><div class="card__cover"><canvas data-cover="' + esc(p.slug) + '" aria-hidden="true"></canvas></div>' +
        '<div class="card__body"><span class="topic">' + hl(p.topic) + ' · ' + esc(p.date) + '</span><h2>' + hl(p.title) + '</h2><p class="quote">“' + esc(p.quote) + '”</p>' +
        '<div class="meta"><span>' + p.min + ' min read</span><span class="read">Read <svg viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span></div></div></a>';
    }).join('');
    $$('[data-cover]', g).forEach(function (cv) { B.cover(cv, window.BLOG.find(cv.dataset.cover)); });
    // fill every row: three across, with two-across rows first when the count does not divide by three
    var cards = $$('.card', g), n = cards.length, wide = n === 1 ? 0 : n % 3 === 2 ? 2 : n % 3 === 1 ? 4 : 0;
    cards.forEach(function (c, i) { c.classList.toggle('wide', i < wide); c.classList.toggle('solo', n % 2 === 1 && i === n - 1); c.classList.toggle('full', n === 1); });
  }

  // come back to the same search, topic and scroll position after reading a blog
  var KEY = 'library-state';
  try {
    var s = /post\.html/.test(document.referrer) ? JSON.parse(sessionStorage.getItem(KEY) || 'null') : null;
    if (s) { query = s.q || ''; q.value = query; $('#clear').hidden = !query; setTopic(s.t); }
  } catch (e) {}
  render();
  try { if (s && s.y) requestAnimationFrame(function () { scrollTo(0, s.y); }); } catch (e) {}
  function save() { try { sessionStorage.setItem(KEY, JSON.stringify({ q: query, t: topic, y: scrollY })); } catch (e) {} }
  addEventListener('pagehide', save);
  document.addEventListener('click', function (e) { if (e.target.closest && e.target.closest('.card')) save(); });
})();
</script>
</body>
</html>
